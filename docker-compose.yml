# Example docker-compose setup. Copy to docker-compose.yml (or use as-is
# if you're fine with the defaults) and adjust the volume path / env vars
# for your setup.
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in RIOT_API_KEY etc.
#   docker compose up -d --build
#
# Builds the root Dockerfile, which compiles the React frontend (frontend/)
# and bakes it into the Express + SQLite backend (backend/) as one image --
# see Dockerfile for details.
#
# Runs the container as your own host user (via UID/GID below) so files
# in ./backend/data — including app.db and the CSV — stay owned by you, no
# chown/sudo dance needed to edit the CSV between runs. Export UID/GID
# before running compose, or set them in backend/.env:
#   UID=$(id -u) GID=$(id -g) docker compose up -d --build

services:
  summerlol-draft:
    build:
      context: .
      dockerfile: Dockerfile
    image: summerlol-draft
    container_name: summerlol-draft
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - backend/.env
    environment:
      - PORT=3000
